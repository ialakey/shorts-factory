name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  syntax:
    name: Синтаксис
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Компиляция всех модулей
        run: python -m compileall -q analysis core infrastructure ingestion publishing rendering app.py config.py

  tests:
    name: Тесты пайплайна
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Установка ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffmpeg -version | head -1
          ffprobe -version | head -1

      - name: Установка зависимостей
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt

      # Быстрый слой: оркестрация, отбор моментов, валидация, слои рендера,
      # публикация. Сеть и тяжёлые модели замоканы в tests/conftest.py.
      - name: Быстрые тесты
        run: pytest -m "not render" --junitxml=reports/unit.xml

      # Медленный слой: каждый этап make_clips реально рендерит клип через
      # moviepy/ffmpeg, плюс сквозной прогон канала.
      - name: Рендер по этапам пайплайна
        run: pytest -m render --junitxml=reports/render.xml

      - name: Отчёты
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: reports/
          if-no-files-found: ignore
