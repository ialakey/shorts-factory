# ============================================================================
# Demo channel configuration / Конфиг демо-канала
#
# EN: Every knob of the pipeline lives here. The values below are neutral
#     defaults meant for a first run — tune them, do not treat them as
#     "the right" numbers. Full reference: docs/CONFIG_REFERENCE.md
# RU: Здесь собраны все параметры пайплайна. Значения ниже — нейтральные
#     дефолты для первого запуска, а не «правильные» числа: их нужно крутить.
#     Полный справочник — docs/CONFIG_REFERENCE.md
# ============================================================================

channel_name: "DemoChannel"  # Имя канала; должно совпадать с именем папки в channels/

debug: false  # true — читать видео из test_data/ и писать в output_test_data/

# ----------------------------------------------------------------------------
# pipeline — порядок этапов. Закомментируйте строку, чтобы отключить этап.
# ----------------------------------------------------------------------------
pipeline:
#  - kodik_download       # (опционально) скачать исходники перед обработкой; нужен KODIK_TOKEN
  - transcribe_video      # распознаём речь (Whisper) и получаем расшифровку
  - analyze_moment        # скоринг + LLM: ищем самые сильные фрагменты
  - make_clips            # собираем вертикальные клипы
  - dynamic_shorts        # виртуальная камера: динамический кроп 16:9 → 9:16
  - watermark             # водяной знак поверх видео
  - enhance_audio         # компрессия оригинальной дорожки
  - video_effects         # цветокор, скорость, зеркало
#  - music                # фоновая музыка (нужен файл в assets/musics)
  - subtitles             # пословные субтитры с подсветкой ключевого слова
  - spoof_metadata        # пересобираем контейнер и чистим метаданные
#  - telegram_notify      # отправляем готовые клипы в Telegram

# ----------------------------------------------------------------------------
# kodik_download — что скачать перед обработкой.
# Формат элемента: ["Название", "серии", "озвучка"], например ["Тайтл", "1-3", "AniLibria"].
# ----------------------------------------------------------------------------
kodik_download: []

# ----------------------------------------------------------------------------
# video — размер финального кадра
# ----------------------------------------------------------------------------
video:
  width: 1080   # Итоговая ширина кадра (px)
  height: 1920  # Итоговая высота кадра (px)

# ----------------------------------------------------------------------------
# background — фоновый слой под исходным видео
# ----------------------------------------------------------------------------
background:
  use_transparent_window: false  # true — искать прозрачное окно в PNG-шаблоне из assets/backgrounds
  use_blurred_background: true   # true — генерировать фон размытием исходного видео (картинки не нужны)
  blur_strength: 85              # Сила размытия (больше — мягче)
  background_scale: 1            # Во сколько раз увеличить кадр перед размытием
  width: 1080                    # Ширина фонового полотна
  height: 1920                   # Высота фонового полотна
  fit_mode: "cover"              # contain (вписать с полями) | cover (обрезать под кадр)

  # Позиция исходного видео на фоне (только при use_transparent_window: false)
  video_width: 1080
  video_height: 1920
  video_x: 0
  video_y: 0

# ----------------------------------------------------------------------------
# dynamic_shorts — виртуальная камера.
# profile задаёт базовое поведение (static | operator | action);
# любой ключ ниже точечно переопределяет профиль.
# ----------------------------------------------------------------------------
dynamic_shorts:
  profile: "operator"

  # --- анализ лиц ---
  analysis_fps: 8                # частота анализа кадров (кадр/сек)
  min_face_ratio: 0.06           # минимальный размер лица относительно кадра
  min_face_confidence: 0.75      # порог доверия детектору (0—1)
  match_tolerance: 0.18          # радиус сопоставления лица между кадрами
  max_miss_time: 2.5             # сколько секунд держим фокус после потери лица
  face_switch_margin: 0.15       # насколько новый герой должен выигрывать, чтобы забрать фокус
  face_switch_hold_s: 0.5        # ...и сколько секунд удерживать это преимущество
  face_filter: 0.80              # low-pass по координатам лица
  max_face_step: 0.04            # анти-джерк: максимальный скачок лица за кадр

  # --- движение камеры ---
  smoothing: 0.93                # лаг камеры по цели (0 — мгновенно)
  stabilization_strength: 0.26   # доп. фиксация, когда в кадре одно лицо
  center_dead_zone: 0.052        # мёртвая зона по ошибке слежения
  predictive_lead: 0.065         # камера смотрит чуть вперёд движения
  human_lag: 0.02                # микрозадержка «живой руки»
  side_bias: 0.22                # смещение к линии третей
  side_bias_strength: 0.37
  eye_level_lift: 0.10           # целимся на уровень глаз, а не в центр лица
  face_margin: 0.085             # защитный зазор до края кадра

  # --- зум (0 — выключен) ---
  face_coverage: 0.0             # целевая высота лица в кадре
  max_zoom: 1.0                  # > 1.0 включает зум под face_coverage
  zoom_smoothing: 0.75
  max_zoom_speed: 0.25

  # --- монтажные склейки ---
  scene_cut_detection: true      # на склейке камера пересобирает кадр, а не «переезжает»
  scene_cut_threshold: 0.20
  scene_cut_min_interval_s: 0.4

  # --- Ken Burns, когда лиц нет ---
  fallback_recenter_s: 3.0       # за сколько секунд без лица уходим к центру
  ken_burns_period: 12
  ken_burns_pan_amplitude: 0.03
  ken_burns_tilt_amplitude: 0.02
  ken_burns_zoom_amplitude: 0.0

# ----------------------------------------------------------------------------
# watermark — водяной знак
# ----------------------------------------------------------------------------
watermark:
  text: "YOUR_HANDLE"            # Текст водяного знака — подставьте свой
  color: "#FFFFFF"
  font_size: 62
  opacity: 0.44                  # 0 — прозрачный, 1 — непрозрачный
  shadow_color: "#000000"
  shadow_opacity: 0.25
  shadow_offset: 2               # Смещение тени по диагонали (px)
  position: ["center", "bottom"] # left/center/right + top/center/bottom
  padding_x: 0
  padding_y: 12

# ----------------------------------------------------------------------------
# video_effects — пост-обработка. Значения около 1.0 = почти без изменений.
# ----------------------------------------------------------------------------
video_effects:
  mirror: false                  # true — отзеркалить кадр по горизонтали
  color_saturation: 1.0
  gamma: 1.0
  contrast: 1.0
  resize: 1.0
  frame_rate: "random"           # число или "random"
  speed: 1.0                     # 1.0 — оригинальная скорость

# ----------------------------------------------------------------------------
# music — фоновая музыка (нужен файл в assets/musics)
# ----------------------------------------------------------------------------
music:
  volume: 0.07                   # Громкость относительно исходной дорожки (0—1)

# ----------------------------------------------------------------------------
# audio_enhancer — компрессия динамического диапазона оригинальной дорожки
# ----------------------------------------------------------------------------
audio_enhancer:
  enabled: true
  threshold: 0.32                # Порог срабатывания (0—1, ниже — сильнее сжатие)
  ratio: 4.5                     # Насколько ужимаем пики
  soft_knee: 0.1                 # Плавность перехода около порога
  makeup_gain: 1.7               # Компенсация громкости после сжатия
  noise_floor: 0.02              # Минимальный уровень, чтобы тихие места не пропадали
  output_ceiling: 0.98           # Защита от клиппинга

# ----------------------------------------------------------------------------
# subtitles — пословные субтитры
# ----------------------------------------------------------------------------
subtitles:
  emoji_font_path: "assets/fonts/NotoColorEmoji.ttf"  # цветные эмодзи через Pilmoji
  emoji_font_size: 68
  font_size: 56
  color: "#FFF8D6"
  stroke_color: "#000000"
  stroke_width: 4

  shadow_color: "#160800"
  shadow_opacity: 0.35
  shadow_offset_x: 0
  shadow_offset_y: 1
  shadow_blur: 1.5

  bg_color: "transparent"        # Подложка под текстом
  bg_opacity: 0.0

  align: "center"                # left | center | right
  bottom_padding: 130            # Отступ от нижнего края (px)
  max_width: 1000                # Максимальная ширина текстового блока (px)
  words_per_chunk: 1             # Слов в одном чанке (1 — «караоке»-ритм)
  language: null                 # null — автоопределение Whisper

  highlight_style:               # Оформление слов внутри <hl>...</hl>
    font_size: 56
    color: "#ff6b6b"
    stroke_width: 4

  improve_transcript_quality: false     # true — второй проход Whisper + чистка текста через LLM
  whisper_model: "base"                 # tiny | base | small | medium | large-v3-turbo
  enhanced_whisper_model: "small"       # Модель при improve_transcript_quality: true
  enhancer_model: "gpt-5.1-2025-11-13"  # LLM для пост-обработки субтитров
  subtitle_mode: "normal"               # normal | meta_ad

  fade_in: 0.03                  # Появление (сек)
  fade_out: 0.03                 # Затухание (сек)

  prompt: |
    Ты редактор субтитров. Твой ввод — черновой текст после распознавания речи.
    Нужно почистить текст, исправить орфографию и удалить мусорные символы.
    Правила:
    1. Сохрани смысл и порядок слов.
    2. Удали повторяющиеся буквы, бессмысленные вставки и спецсимволы.
    3. Не добавляй новые предложения, только исправляй существующие.
    4. Выдели ровно одно ключевое слово тегом <hl>...</hl> — смысловой центр фразы.
    5. Верни только финальный исправленный текст без пояснений.
    {language_instructions}
    Текст:
    {text}

  meta_ad_prompt: |
    Ты генератор авторских субтитров, а не редактор.
    Оригинальный текст игнорируй — он нужен только как ориентир по длине.

    Правила формата:
    - Каждое слово с новой строки.
    - Длина ≈ количеству слов во входном тексте (±10%).
    - Только короткие слова (1–3 слога).
    - Ровно одно ключевое слово в теге <hl>...</hl> (не первое и не последнее).

    Верни только финальный текст, без пояснений.

    Текст для ориентира по длине:
    {text}

# ----------------------------------------------------------------------------
# moment_scoring — детерминированный отбор кандидатов ДО похода в LLM.
# Он же экономит токены: в промпт уходит только верхушка списка.
# ----------------------------------------------------------------------------
moment_scoring:
  enabled: true
  cell_s: 0.5                # разрешение временной сетки сигналов (сек)
  step_s: 1.0                # шаг скользящего окна (сек)
  length_steps: 3            # сколько длительностей пробуем в диапазоне gpt.min_time..max_time
  hook_window_s: 2.0         # окно анализа «входа» в клип
  max_candidates: 12         # сколько кандидатов остаётся после NMS
  prompt_limit: 8            # сколько из них уходит в промпт
  nms_overlap: 0.45          # выше — допускаем более похожих кандидатов
  min_speech_density: 0.18   # ниже — окно считается пустым и штрафуется
  min_face_coverage: 0.0     # 0 — не требуем лиц в кадре
  max_silence_gap_s: 2.5     # более длинная пауза внутри окна = «провисание»
  weights:                   # веса сигналов, нормализуются к сумме 1
    transcript: 0.24         # плотность и содержание реплик
    audio: 0.20              # эмоциональные пики звука
    face: 0.14               # есть ли на чём держать вертикальный фокус
    scene: 0.12              # смены планов и движение
    pacing: 0.14             # темп, отсутствие провисаний
    hook: 0.16               # сила входа в первые 1–2 секунды

# ----------------------------------------------------------------------------
# moment_validation — починка того, что вернула модель.
# LLM регулярно промахивается на доли секунды: границы притягиваются к паузам
# речи и монтажным склейкам, слишком короткие куски отбрасываются.
# ----------------------------------------------------------------------------
moment_validation:
  enabled: true
  min_segment_s: 1.2         # сегмент короче — это «моргание», а не монтажный кусок
  snap_tolerance_s: 0.6      # на сколько секунд можно подвинуть границу
  snap_to_speech: true
  snap_to_cuts: true
  min_speech_density: 0.05   # жёсткий минимум, иначе клип пустой
  min_audio_energy: 0.15     # ...спасти пустой по речи момент может только звук
  fill_from_candidates: true # добрать недостачу эвристикой, а не падать

# ----------------------------------------------------------------------------
# gpt — LLM-этап выбора моментов
# ----------------------------------------------------------------------------
gpt:
  model: "gpt-5.1-2025-11-13"
  face_analysis_interval_s: 5.0  # анализ лиц для промпта: 1 кадр в N секунд

  min_time: 28                   # минимальная длительность клипа (сек)
  max_time: 43                   # максимальная длительность клипа (сек)
  min_count: 2                   # минимум моментов на одно видео
  max_count: 3                   # максимум моментов на одно видео

  audience_age: "18–25"
  platforms: "YouTube Shorts, TikTok"
  tone: "вирусный, эмоциональный, интригующий"

  prompt: |
    Ты — монтажный сценарист коротких видео для {platforms}
    и аудитории {audience_age}. Тон: {tone}.

    ---
    ТРАНСКРИПТ:
    {transcript_text}
    АУДИО:
    {audio}
    ЛИЦА:
    {face}
    КАНДИДАТЫ:
    {candidates}
    ---

    КАНДИДАТЫ — окна, уже отранжированные детерминированным скорингом
    (речь, звук, лица, склейки, темп, hook). Это карта материала, а не приказ:
    - бери сборку из этих окон или уточняй их границы;
    - окна с warnings бери только при сильном смысловом аргументе;
    - выдумывать окно с нуля можно, но оно должно быть явно сильнее верхних кандидатов.

    ПРАВИЛА ОТБОРА:
    - явный HOOK в первые 1–2 секунды;
    - суммарная длительность segments — от {min_time} до {max_time} секунд;
    - момент читается как мини-история и понятен без контекста;
    - всего от {min_count} до {max_count} моментов; если подходящих нет — верни {{}}.

    TITLE:
    - только верхний регистр, максимум 45 символов;
    - без знаков препинания и тире;
    - 1–2 эмодзи в конце;
    - запрещены слова "эпизод", "серия", "момент", "аниме".

    SEGMENTS — это монтажная сборка: куски могут быть из разных частей
    транскрипта, HOOK всегда в segment_1, последний segment — клиффхэнгер
    или логичный loop к началу.

    ФОРМАТ ВЫВОДА — только JSON, тайминги в секундах (float):

    {{
        "moment_1": {{
            "title": "ОН ЗНАЛ ЭТО ЗАРАНЕЕ 😱",
            "duration": 35.0,
            "segments": {{
                "segment_1": {{ "start": 12.3, "end": 14.8 }},
                "segment_2": {{ "start": 45.1, "end": 48.7 }}
            }}
        }},
        "moment_2": {{
            "title": "ОНА СКАЗАЛА ЭТО ВСЛУХ 💀",
            "duration": 41.2,
            "segments": {{
                "segment_1": {{ "start": 7.2, "end": 9.9 }},
                "segment_2": {{ "start": 22.4, "end": 26.1 }}
            }}
        }}
    }}

# ----------------------------------------------------------------------------
# telegram — доставка готовых клипов.
# Токен и chat_id читаются ТОЛЬКО из переменных окружения
# (TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID) — не храните их в этом файле.
# ----------------------------------------------------------------------------
telegram:
  enabled: false
